short_bio: >-
  <p>
    I am a Ph.D. candidate in <b>Biomedical Informatics at the University of California, San Diego</b>,
    advised by <a href="https://profiles.ucsd.edu/ronghui.xu" target="_blank">Dr. Ronghui Xu</a> and
    <a href="https://scholar.google.com/citations?user=p5oyKn0AAAAJ&hl=en" target="_blank">Dr. Siddharth Singh</a>.
    I am especially interested in how real-world evidence informs decisions across drug discovery,
    clinical development, and regulatory review.
  </p>
  <p>
    My research focuses on statistical methodology and its application to <b>causal inference</b> to
    generate <b>regulatory-grade real-world evidence</b>. My dissertation spans both. Methodologically,
    I develop <b>data-fusion methods for indirect treatment comparisons</b> across randomized trials when
    head-to-head evidence is unavailable. In application, I conduct observational studies of treatment
    safety and effectiveness in gastroenterology, using large-scale claims and EHR data (Optum, Epic
    Cosmos) with <b>target trial emulation</b>, propensity score methods, and survival analysis.
  </p>
  <p>
    I am currently an <b>FDA-OCE-ASA Oncology Educational Fellow</b> (2026–2027), one of 20 fellows
    selected nationwide. My work has appeared in <i>Clinical Gastroenterology and Hepatology</i>,
    <i>JAMA Network Open</i>, <i>Alimentary Pharmacology &amp; Therapeutics</i>, <i>Hypertension</i>,
    and <i>Annals of Surgical Oncology</i>, among others.
  </p>
  <p>
    Previously, I earned an M.S. in Biostatistics from UCLA and a B.S. in Public Health from National
    Taiwan University, and worked as a Biostatistician Intern at Foundation Medicine, Inc.
  </p>

