short_bio: >-
  <p>
    I am a Ph.D. candidate in Biomedical Informatics at the University of California, San Diego,
    advised by Dr. Ronghui Xu and Dr. Siddharth Singh.
  </p>
  <p>
    My research focuses on statistical methodology for causal inference to generate regulatory-grade
    real-world evidence. I evaluate treatment safety and effectiveness in gastroenterology using
    large-scale claims and EHR data (Optum, Epic Cosmos), with target trial emulation, propensity score
    methods, and survival analysis. My dissertation develops data-fusion methods for indirect treatment
    comparisons across randomized trials, for settings where head-to-head evidence is not available.
  </p>
  <p>
    I am currently an FDA-OCE-ASA Oncology Educational Fellow (2026–2027), one of 20 fellows selected
    nationwide. My work has appeared in <i>Clinical Gastroenterology and Hepatology</i>,
    <i>JAMA Network Open</i>, <i>Alimentary Pharmacology &amp; Therapeutics</i>,
    <i>Hypertension</i>, and <i>Annals of Surgical Oncology</i>, among others.
  </p>
  <p>
    Previously, I earned an M.S. in Biostatistics from UCLA and a B.S. in Public Health from
    National Taiwan University, and worked as a Biostatistician Intern at Foundation Medicine, Inc.
  </p>

